<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="score">0</div>
</div>

<div id="overlay">
  <div class="card">
    <h1>Flappy Bird</h1>
    <p>اضغط/المس للقفز</p>
    <button id="startBtn">ابدأ</button>
    <div class="hint">عمودي للجوال — طائر بسيط</div>
  </div>
</div>

<div id="over">
  <div class="card">
    <h2>انتهت اللعبة</h2>
    <p>نتيجتك: <span id="finalScore">0</span></p>
    <button id="retryBtn">إعادة</button>
  </div>
</div>
