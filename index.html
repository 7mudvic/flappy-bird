<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flappy Style</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <!-- UI -->
  <div id="ui">
    <button id="pauseBtn" class="pause" aria-label="Pause">II</button>

    <!-- START -->
    <div id="startScreen" class="screen show">
      <div class="logoWrap">
        <div class="pixelTitle">FLAPPY BIRD</div>
        <div class="pixelSubtitle">START</div>
      </div>
      <button id="startBtn" class="btn">START</button>
      <div class="hint">اضغط START ثم TAP للّعب</div>
    </div>

    <!-- GET READY -->
    <div id="readyScreen" class="screen">
      <div class="getReady">GET READY</div>
      <div class="tapWrap">
        <div class="tapArrow">↑</div>
        <div class="tapText">TAP</div>
      </div>
      <div class="hint">اضغط على الشاشة للقفز</div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen" class="screen">
      <div class="gameOver">GAME OVER</div>

      <div class="board">
        <div class="medalBox">
          <div id="medal" class="medal none" title="Medal"></div>
        </div>

        <div class="stats">
          <div class="row">
            <div class="k">SCORE</div>
            <div class="v" id="finalScore">0</div>
          </div>
          <div class="row">
            <div class="k">BEST</div>
            <div class="v" id="bestScore">0</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="okBtn" class="btn">OK</button>
        <button id="shareBtn" class="btn ghost">SHARE</button>
      </div>

      <div class="hint">اضغط OK لإعادة اللعب</div>
    </div>

    <div id="audioHint" class="audioHint">🔊 إذا ما اشتغل الصوت: اضغط START ثم TAP داخل اللعبة</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
