<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">
    <canvas id="game" width="360" height="640" aria-label="Flappy Bird Game"></canvas>

    <!-- زر باوز صغير (ما طلبته في آخر رسالة، لذلك مخفي) -->
    <!-- <button id="pauseBtn" class="pause" aria-label="Pause">II</button> -->

    <!-- شاشة البداية -->
    <div id="startOverlay" class="overlay">
      <div class="panel">
        <!-- الطير فوق اسم اللعبة -->
        <div id="startBird" aria-hidden="true"></div>

        <div class="title">FLAPPY BIRD</div>

        <!-- زر START فقط -->
        <button id="startBtn" class="btn primary">START</button>
      </div>
    </div>

    <!-- شاشة TAP (لا تعدل عليها شي — Get Ready + Tap) -->
    <div id="tapOverlay" class="overlay" style="display:none;">
      <div class="panel">
        <div class="getready">GET READY</div>
        <div class="tapHint">
          <div class="arrow">↑</div>
          <div class="tap">TAP</div>
        </div>
      </div>
    </div>

    <!-- شاشة الخسارة -->
    <div id="gameOverOverlay" class="overlay" style="display:none;">
      <div class="panel over-panel">
        <div class="gameover">GAME OVER</div>

        <div class="scoreboard">
          <div id="medalSlot" class="medal-slot"></div>

          <div class="score-lines" dir="ltr">
            <div class="line"><span>SCORE</span><span id="finalScore">0</span></div>
            <div class="line"><span>BEST</span><span id="bestScore">0</span></div>
          </div>
        </div>

        <div class="actions">
          <button id="okBtn" class="btn primary">OK</button>
          <button id="shareBtn" class="btn">SHARE</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
