<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flappy Style</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">

    <!-- HUD (يظهر فقط أثناء اللعب) -->
    <button id="pauseBtn" class="hudBtn" aria-label="Pause">II</button>
    <button id="homeBtn" class="hudBtn" aria-label="Home">⌂</button>

    <!-- START -->
    <div id="startScreen" class="screen show">

      <!-- زر الخيارات (فقط هنا) -->
      <button id="optionsBtn" class="optionsBtn" aria-label="Options">☰</button>

      <div id="startBird" aria-hidden="true"></div>

      <div class="logoWrap">
        <div class="pixelTitle">FLAPPY BIRD</div>
        <div class="pixelSubtitle">START</div>
      </div>

      <button id="startBtn" class="btn">START</button>

      <!-- تحت زر ستارت -->
      <div class="startActions">
        <button id="registerOpenBtn" class="btn mini">تسجيل</button>
        <button id="loginOpenBtn" class="btn mini">دخول</button>
        <button id="leaderboardOpenBtn" class="btn mini ghost">لوحة المتصدرين</button>
      </div>

      <div class="userBadge" id="userBadge"></div>
    </div>

    <!-- READY -->
    <div id="readyScreen" class="screen">
      <div class="getReady">GET READY</div>
      <div class="tapWrap">
        <div class="tapArrow">↑</div>
        <div class="tapText">TAP</div>
      </div>
      <div class="hint">اضغط على الشاشة للقفز</div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen" class="screen">
      <div class="gameOver">GAME OVER</div>

      <div class="board">
        <div class="medalBox">
          <div id="medal" class="medal none" title="Medal"></div>
        </div>

        <div class="stats">
          <div class="row">
            <div class="k">SCORE</div>
            <div class="v" id="finalScore">0</div>
          </div>
          <div class="row">
            <div class="k">BEST</div>
            <div class="v" id="bestScore">0</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="okBtn" class="btn">OK</button>
        <button id="shareBtn" class="btn ghost">SHARE</button>
      </div>
    </div>

    <!-- ===== MODALS ===== -->

    <!-- OPTIONS -->
    <div id="optionsModal" class="modal">
      <div class="modalCard">
        <div class="modalHeader">
          <div class="modalTitle">الخيارات</div>
          <button class="xBtn" id="optionsCloseBtn" aria-label="Close">✕</button>
        </div>

        <div class="modalBody">
          <button id="soundToggleBtn" class="btn wide">🔊 الصوت: تشغيل</button>
          <button id="privacyBtn" class="btn wide ghost">سياسة الخصوصية</button>

          <div class="divider"></div>

          <!-- زينة فقط -->
          <button class="btn wide ghost" disabled>زر (زينة)</button>
          <button class="btn wide ghost" disabled>زر (زينة)</button>
        </div>
      </div>
    </div>

    <!-- PRIVACY -->
    <div id="privacyModal" class="modal">
      <div class="modalCard">
        <div class="modalHeader">
          <div class="modalTitle">سياسة الخصوصية</div>
          <button class="xBtn" id="privacyCloseBtn" aria-label="Close">✕</button>
        </div>
        <div class="modalBody privacyText">
          <p>هذه نسخة تجريبية.</p>
          <p>الحسابات محفوظة محليًا على جهازك فقط.</p>
          <p>لوحة المتصدرين في هذه الجلسة فقط (بدون تخزين).</p>
        </div>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="registerModal" class="modal">
      <div class="modalCard">
        <div class="modalHeader">
          <div class="modalTitle">تسجيل</div>
          <button class="xBtn" id="registerCloseBtn" aria-label="Close">✕</button>
        </div>

        <div class="modalBody">
          <label class="field">
            <span>اسم المستخدم (3 أحرف+)</span>
            <input id="regUser" type="text" placeholder="مثال: ali" autocomplete="username" />
          </label>

          <label class="field">
            <span>كلمة المرور (6 أحرف/أرقام+)</span>
            <input id="regPass" type="password" placeholder="******" autocomplete="new-password" />
          </label>

          <button id="registerBtn" class="btn wide">إنشاء حساب</button>
          <div id="registerMsg" class="msg"></div>
        </div>
      </div>
    </div>

    <!-- LOGIN -->
    <div id="loginModal" class="modal">
      <div class="modalCard">
        <div class="modalHeader">
          <div class="modalTitle">دخول</div>
          <button class="xBtn" id="loginCloseBtn" aria-label="Close">✕</button>
        </div>

        <div class="modalBody">
          <label class="field">
            <span>اسم المستخدم</span>
            <input id="loginUser" type="text" placeholder="اسم المستخدم" autocomplete="username" />
          </label>

          <label class="field">
            <span>كلمة المرور</span>
            <input id="loginPass" type="password" placeholder="******" autocomplete="current-password" />
          </label>

          <button id="loginBtn" class="btn wide">دخول</button>
          <div id="loginMsg" class="msg"></div>
        </div>
      </div>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboardModal" class="modal">
      <div class="modalCard">
        <div class="modalHeader">
          <div class="modalTitle">لوحة المتصدرين</div>
          <button class="xBtn" id="leaderboardCloseBtn" aria-label="Close">✕</button>
        </div>

        <div class="modalBody">
          <div class="lbHint">أفضل 20 في هذه الجلسة فقط (بدون تخزين).</div>
          <div id="leaderboardList" class="lbList"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
