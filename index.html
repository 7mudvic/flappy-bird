<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <button id="soundBtn" aria-label="الصوت" title="الصوت">🔊</button>
  </div>

  <!-- شاشة البداية -->
  <div id="overlay">
    <div class="card">
      <h1>Flappy Bird</h1>
      <p>اضغط/المس للقفز</p>
      <button id="startBtn">ابدأ</button>
      <div class="hint">عمودي للجوال — طائر بسيط</div>
      <div class="hint2">⚠️ إذا ما اشتغل الصوت: اضغط زر 🔊</div>
    </div>
  </div>

  <!-- شاشة النهاية -->
  <div id="over">
    <div class="card">
      <h2>انتهت اللعبة</h2>
      <p>نتيجتك: <span id="finalScore">0</span></p>
      <button id="retryBtn">إعادة</button>
    </div>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
